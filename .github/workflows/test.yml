name: Firecracker Containerd CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  AWS_REGION: us-west-2

jobs:
  build-and-test:
    name: Build and Test
    runs-on: self-hosted
    
    env:
      DOCKER_IMAGE_TAG: "${{ github.run_id }}"
      EXTRAGOARGS: "-race"
      DISABLE_ROOT_TESTS: 1
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
                    
      - name: Setup build environment
        run: |
          echo "=== Verifying build environment ==="
          
          # Verify persistent dependencies
          echo "Checking persistent tools..."
          make --version || { echo "❌ make not found"; exit 1; }
          git --version || { echo "❌ git not found"; exit 1; }
          docker --version || { echo "❌ docker not found"; exit 1; }
          curl --version || { echo "❌ curl not found"; exit 1; }
          
          # Check Docker permissions
          if ! docker ps > /dev/null 2>&1; then
            echo "❌ Docker permission denied. Runner user must be in docker group."
            echo "Run on EC2: sudo usermod -aG docker <runner-user> && newgrp docker"
            exit 1
          fi
          
          # Install Go if not present or wrong version
          GO_VERSION="1.24.2"
          if ! command -v go &> /dev/null || ! go version | grep -q "go1.24"; then
            echo "Installing Go ${GO_VERSION}..."
            cd /tmp
            curl -LO "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz"
            sudo rm -rf /usr/local/go
            sudo tar -C /usr/local -xzf "go${GO_VERSION}.linux-amd64.tar.gz"
            export PATH=$PATH:/usr/local/go/bin
            echo "/usr/local/go/bin" >> $GITHUB_PATH
          fi
          
          # Verify Go installation
          go version
          
          # Set Go environment for this workflow
          echo "GOPATH=$HOME/go" >> $GITHUB_ENV
          echo "GO111MODULE=on" >> $GITHUB_ENV
          echo "$HOME/go/bin" >> $GITHUB_PATH
          
          echo "✅ Build environment ready"
          
      - name: Set up environment
        run: |
          echo "Build started on $(date)"
          echo "Runner: self-hosted"
          echo "Docker image tag: $DOCKER_IMAGE_TAG"
          
          # Create artifacts directory (equivalent to /local/artifacts in Buildkite)
          mkdir -p /tmp/artifacts/$DOCKER_IMAGE_TAG
          
          # Set Docker registry preference to avoid rate limits
          echo "Using AWS ECR Public as primary registry to avoid Docker Hub rate limits"
          
      - name: Authenticate with ECR Public for build images
        run: |
          echo "=== Authenticating with ECR Public for build phase ==="
          
          # Authenticate with ECR Public (always uses us-east-1 region)
          echo "Authenticating with ECR Public..."
          if aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws; then
            echo "✅ ECR Public authentication successful"
          else
            echo "❌ ECR Public authentication failed"
            echo "Checking AWS CLI configuration..."
            aws sts get-caller-identity || echo "No AWS credentials available"
            exit 1
          fi
          
      - name: "Phase 1: Build test images"
        run: |
          echo "=== Building test images ==="
          make test-images
          
          echo "Cleaning up rootfs directory..."
          docker run --rm -v $PWD:/mnt public.ecr.aws/debian/debian:bookworm-slim rm -rf /mnt/tools/image-builder/rootfs
          
          echo "Fixing directory permissions after Docker cleanup..."
          sudo chown -R $(whoami):$(whoami) tools/image-builder/
          
          echo "Copying rootfs image to artifacts..."
          cp tools/image-builder/rootfs.img /tmp/artifacts/$DOCKER_IMAGE_TAG/
          
      - name: "Phase 2: Loop device cleanup check"
        run: |
          echo "=== Checking for loop device leaks ==="
          sudo losetup -l || echo "No losetup available or no loop devices"
          
      - name: "Phase 3: Verify proto files"
        timeout-minutes: 1
        run: |
          echo "=== Verifying protobuf files ==="
          make proto
          
          if [ -n "$(git status --porcelain)" ]; then
            echo "❌ Generated protobuf code differs from committed files"
            git status
            echo ""
            echo "Generated protobuf code differs from committed, please run 'make proto' and commit the updated files."
            exit 1
          else
            echo "✅ Protobuf files are up to date"
          fi
          
      # - name: "Phase 4: Unit tests"
      #   timeout-minutes: 10
      #   run: |
      #     echo "=== Running unit tests ==="
      #     
      #     echo "Restoring rootfs image for tests..."
      #     cp /tmp/artifacts/$DOCKER_IMAGE_TAG/rootfs.img tools/image-builder/rootfs.img
      #     
      #     echo "Running unit tests in docker..."
      #     export EXTRAGOARGS="-v -count=1 -race"
      #     make test-in-docker
          
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-image-${{ github.run_id }}
          path: tools/image-builder/rootfs.img
          retention-days: 7

  runtime-integration-tests:
    name: Runtime Integration Tests
    needs: [build-and-test]
    runs-on: self-hosted
    
    env:
      DOCKER_IMAGE_TAG: "${{ github.run_id }}"
      NUMBER_OF_VMS: 10
      EXTRAGOARGS: "-v -count=1 -race"
      # Don't set FICD_DM_VOLUME_GROUP to use loopback device mapper mode
      FICD_DM_POOL: "build_${{ github.run_id }}_runtime"
      CI: true
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          
      - name: Setup build environment for integration tests
        run: |
          echo "=== Setting up Go environment for integration tests ==="
          
          # Install Go if not present or wrong version
          GO_VERSION="1.24.2"
          if ! command -v go &> /dev/null || ! go version | grep -q "go1.24"; then
            echo "Installing Go ${GO_VERSION}..."
            cd /tmp
            curl -LO "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz"
            sudo rm -rf /usr/local/go
            sudo tar -C /usr/local -xzf "go${GO_VERSION}.linux-amd64.tar.gz"
            export PATH=$PATH:/usr/local/go/bin
            echo "/usr/local/go/bin" >> $GITHUB_PATH
          fi
          
          # Verify Go installation
          go version
          
          # Set Go environment for this workflow
          echo "GOPATH=$HOME/go" >> $GITHUB_ENV
          echo "GO111MODULE=on" >> $GITHUB_ENV
          echo "$HOME/go/bin" >> $GITHUB_PATH
          
          echo "✅ Go environment ready for integration tests"
          
      - name: Pre-download Go dependencies for tests
        run: |
          echo "=== Pre-downloading Go dependencies into Docker volume ==="
          
          # Download dependencies into the same Docker volume used by tests
          # This ensures the test container (which runs with --network=none) has all deps
          docker run --rm \
            --volume $(pwd):/src \
            --volume gocache:/go \
            --workdir=/src/runtime \
            --env GOPROXY=direct \
            --env GOSUMDB=off \
            golang:1.24.2 \
            sh -c "go mod download && go mod verify"
          
          echo "✅ Go dependencies downloaded successfully into Docker volume"
          
      - name: Download rootfs artifact
        uses: actions/download-artifact@v4
        with:
          name: rootfs-image-${{ github.run_id }}
          path: tools/image-builder/
          
          
      - name: Setup KVM and device mapper for integration tests
        run: |
          echo "=== Setting up KVM and device mapper infrastructure ==="
          
          # Detect operating system and architecture
          echo "System Information:"
          echo "- OS: $(cat /etc/os-release | grep PRETTY_NAME | cut -d'"' -f2)"
          echo "- Kernel: $(uname -r)"
          echo "- Architecture: $(uname -m)"
          echo "- CPU: $(grep 'model name' /proc/cpuinfo | head -1 | cut -d':' -f2 | xargs)"
          
          # Update system packages
          echo "Updating system packages..."
          sudo apt-get update -y
          
          # Install KVM and device mapper packages for Ubuntu
          echo "Installing KVM and device mapper packages..."
          sudo apt-get install -y \
            qemu-kvm \
            libvirt-daemon-system \
            libvirt-clients \
            bridge-utils \
            lvm2 \
            thin-provisioning-tools \
            bc
          
          # Check CPU virtualization support
          echo "=== Checking CPU virtualization support ==="
          if grep -q "vmx\|svm" /proc/cpuinfo; then
            echo "✅ CPU supports hardware virtualization"
            
            if grep -q "vmx" /proc/cpuinfo; then
              echo "- Intel CPU detected (VMX support)"
              KVM_MODULE="kvm-intel"
            elif grep -q "svm" /proc/cpuinfo; then
              echo "- AMD CPU detected (SVM support)"  
              KVM_MODULE="kvm-amd"
            fi
          else
            echo "❌ CPU does not support hardware virtualization"
            echo "Hardware virtualization flags not found in /proc/cpuinfo"
            grep "flags" /proc/cpuinfo | head -1
            exit 1
          fi
          
          # Load KVM kernel modules with error handling
          echo "=== Loading KVM kernel modules ==="
          
          echo "Loading base kvm module..."
          if ! sudo modprobe kvm 2>&1; then
            echo "❌ Failed to load kvm module"
            sudo dmesg | grep -i kvm | tail -10
            exit 1
          fi
          echo "✅ Base kvm module loaded successfully"
          
          echo "Waiting for kvm module to initialize..."
          sleep 2
          
          echo "Loading $KVM_MODULE module..."
          if ! sudo modprobe $KVM_MODULE 2>&1; then
            echo "❌ Failed to load $KVM_MODULE module"
            echo "=== Diagnostic Information ==="
            echo "Available modules:"
            find /lib/modules/$(uname -r) -name "*kvm*" -type f
            echo ""
            echo "Module dependencies:"
            modinfo $KVM_MODULE 2>/dev/null || echo "modinfo failed for $KVM_MODULE"
            echo ""
            echo "Kernel messages (last 20 lines):"
            sudo dmesg | grep -i kvm | tail -20
            echo ""
            echo "CPU flags:"
            grep "flags" /proc/cpuinfo | head -1
            exit 1
          fi
          echo "✅ $KVM_MODULE module loaded successfully"
          
          # Verify KVM modules are loaded
          echo "=== Verifying KVM modules are active ==="
          if lsmod | grep -q "^kvm "; then
            echo "✅ kvm module active"
          else
            echo "❌ kvm module not active"
            lsmod | grep kvm || echo "No kvm modules found in lsmod"
            exit 1
          fi
          
          # Get the actual module name from modinfo (handles hyphen/underscore conversion)
          ACTUAL_MODULE_NAME=$(modinfo $KVM_MODULE 2>/dev/null | grep "^name:" | awk '{print $2}')
          if [ -z "$ACTUAL_MODULE_NAME" ]; then
            echo "❌ Could not determine actual module name for $KVM_MODULE"
            modinfo $KVM_MODULE 2>&1 || echo "modinfo failed"
            exit 1
          fi
          echo "Checking for actual module name: $ACTUAL_MODULE_NAME"
          
          if lsmod | grep -q "^$ACTUAL_MODULE_NAME "; then
            echo "✅ $KVM_MODULE module active (as $ACTUAL_MODULE_NAME)"
          else
            echo "❌ $KVM_MODULE module not active (expected as $ACTUAL_MODULE_NAME)"
            lsmod | grep kvm || echo "No kvm modules found in lsmod"
            exit 1
          fi
          
          echo "Final module status:"
          lsmod | grep kvm
          
          # Check for KVM device file
          if [ ! -e /dev/kvm ]; then
            echo "❌ /dev/kvm not available - this should not happen on metal instances"
            echo "Checking if KVM modules created the device:"
            ls -la /dev/kvm* 2>/dev/null || echo "No /dev/kvm* devices found"
            echo "Loaded modules:"
            lsmod | grep kvm
            exit 1
          else
            echo "✅ /dev/kvm device exists"
            ls -la /dev/kvm
          fi
          
          # Check KVM device permissions
          if ! sudo test -r /dev/kvm -a -w /dev/kvm; then
            echo "❌ Cannot access /dev/kvm with required permissions"
            echo "Current permissions:"
            ls -la /dev/kvm
            echo "Attempting to fix permissions..."
            sudo chmod 666 /dev/kvm
            ls -la /dev/kvm
          else
            echo "✅ /dev/kvm accessible with required permissions"
          fi
          
          # Test KVM functionality
          echo "=== Testing KVM functionality ==="
          if sudo timeout 10s qemu-system-x86_64 -machine accel=kvm -cpu host -m 64 -nographic -no-reboot -kernel /dev/null 2>&1 | grep -q "could not load kernel"; then
            echo "✅ KVM acceleration is working (kernel load error is expected)"
          else
            echo "❌ KVM acceleration test failed"
            sudo timeout 10s qemu-system-x86_64 -machine accel=kvm -cpu host -m 64 -nographic -no-reboot -kernel /dev/null || true
            exit 1
          fi
          
          # Start libvirt service
          echo "=== Starting libvirt service ==="
          sudo systemctl enable libvirtd
          sudo systemctl start libvirtd
          sudo systemctl status libvirtd --no-pager -l
          
          # Create device mapper pool using loopback mode
          echo "=== Setting up device mapper ==="
          echo "Creating device mapper thin pool: $FICD_DM_POOL"
          ./tools/thinpool.sh create "$FICD_DM_POOL"
          
          echo "=== KVM and device mapper setup complete ==="
          
      - name: Run runtime integration tests
        timeout-minutes: 30
        run: |
          echo "=== Running runtime integration tests ==="
          echo "Device mapper pool: $FICD_DM_POOL"
          echo "Number of VMs: $NUMBER_OF_VMS"
          
          # Run integration tests
          make -C runtime integ-test FICD_DM_POOL="$FICD_DM_POOL"
          
      - name: Cleanup device mapper
        if: always()
        run: |
          echo "=== Cleaning up device mapper resources ==="
          
          # Wait for any pending operations to complete
          echo "Waiting for pending operations to complete..."
          sleep 5
          
          # Force sync and clear caches before cleanup
          sync
          sudo bash -c 'echo 3 > /proc/sys/vm/drop_caches' 2>/dev/null || true
          
          # Check if containerd is still running and clean up snapshots
          if command -v ctr >/dev/null 2>&1; then
            echo "Cleaning up any remaining containerd snapshots..."
            for snap in $(ctr --address /run/firecracker-containerd/containerd.sock snapshots list 2>/dev/null | tail -n +2 | awk '{print $1}' || true); do
              if [ -n "$snap" ] && [ "$snap" != "KEY" ]; then
                echo "Removing containerd snapshot: $snap"
                ctr --address /run/firecracker-containerd/containerd.sock snapshots remove "$snap" 2>/dev/null || true
              fi
            done
          fi
          
          # Additional sync after containerd cleanup
          sync
          sleep 2
          
          # Remove the device mapper pool
          ./tools/thinpool.sh remove "$FICD_DM_POOL" || echo "Pool removal failed, but continuing..."
          
          # Double-check cleanup completed
          echo "Verifying device mapper cleanup completed..."
          if [ -e "/dev/mapper/$(echo ${FICD_DM_VOLUME_GROUP:-""} | sed -e s/-/--/g)-${FICD_DM_POOL}" ] 2>/dev/null; then
            echo "Warning: Device mapper pool still exists after cleanup"
            sudo dmsetup info "/dev/mapper/$(echo ${FICD_DM_VOLUME_GROUP:-""} | sed -e s/-/--/g)-${FICD_DM_POOL}" 2>/dev/null || true
          else
            echo "✅ Device mapper cleanup completed successfully"
          fi
          
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-integration-logs-${{ github.run_id }}
          path: runtime/logs/
          retention-days: 7
